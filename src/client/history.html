<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사용자 채팅 기록 · YoBot</title>
    <link rel="stylesheet" href="history.css">
</head>
<body>
    <header>
        <div class="heading"><span id="platform"></span><h1 id="nickname">채팅 기록</h1></div>
        <p id="identity"></p>
    </header>
    <nav aria-label="사용자 기록">
        <button id="chat-tab" type="button" aria-controls="chat-panel" aria-pressed="true">채팅 기록</button>
        <button id="notes-tab" type="button" aria-controls="notes-panel" aria-pressed="false">매니저 댓글</button>
    </nav>
    <main id="chat-panel" class="panel">
        <p id="status" role="status"></p>
        <div id="viewport" class="viewport" aria-label="채팅 기록" tabindex="0">
            <button id="more" type="button" hidden>이전 기록 더 보기</button>
            <div id="messages"></div>
        </div>
        <footer><span id="count"></span><button id="refresh" type="button">최신 기록</button></footer>
    </main>
    <main id="notes-panel" class="panel" hidden>
        <p id="notes-status" role="status"></p>
        <div id="notes" class="viewport" aria-label="매니저 댓글" tabindex="0"></div>
        <form id="note-form">
            <textarea id="note-input" aria-label="매니저 댓글 입력" placeholder="이 사용자에 대해 기억할 사항" maxlength="2000" required></textarea>
            <button id="note-submit" type="submit" disabled>추가</button>
        </form>
    </main>
    <script type="module" src="history.js"></script>
</body>
</html>
