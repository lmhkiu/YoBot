<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="html-head">꾸덕이 YoBot</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <div id="game-container">
        <canvas>

        </canvas>
    </div>
    <div id="chat-container">
        <h3>채팅 타이틀</h3>
        <div id="chat-messages">
            <div class="chat-message">
                <div class="chat-message-platform-icon-container">
                    <img src="/favicon.png" alt="favicon" style="width: 20px; height: 20px;">
                </div>
                <div class="chat-message-nickname-container">  
                    <div class="chat-message-nickname">꾸덕이</div>
                </div>
                <div class="chat-message-content-container">
                    <strong>1.0.27 업데이트사항</strong><br>
                    1. Node.js가 포함된 YoBot.zip을 제공하며, run.bat으로 바로 실행할 수 있습니다.<br>
                    2. 이후 자동 업데이트 시 사용자 설정과 로컬 채팅 기록을 보존합니다.<br>
                    3. 닉네임을 클릭하면 사용자별 최근 채팅 기록을 최신순으로 확인할 수 있습니다.
                </div>
            </div>
            <div class="chat-message">
                <div class="chat-message-platform-icon-container">
                    <img src="/favicon.png" alt="favicon" style="width: 20px; height: 20px;">
                </div>
                <div class="chat-message-nickname-container">  
                    <div class="chat-message-nickname">YoBot</div>
                </div>
                <div class="chat-message-content-container">
                    오늘도 즐거운 방송!!
                </div>
            </div>
        </div>
        <div id="chat-controller">
            <div id="broad_time">00:00:00</div>
            <div class="memo-container">
                <textarea id="memo-input" placeholder="메모할 내용을 입력하세요..."></textarea>
                <button id="save-memo-btn">메모 저장</button>
                <div id="memo-status" class="memo-status"></div>
            </div>
        </div>
    </div>
    

    <script src="lib/phaser.js"></script>
    <script type="module" src="app.js"></script>
    
</body>

</html>
