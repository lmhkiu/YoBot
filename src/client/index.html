<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="html-head">꾸덕이 YoBot</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <div id="game-container">
        <canvas>

        </canvas>
    </div>
    <div id="chat-container">
        <h3>채팅 타이틀</h3>
        <div id="chat-messages">
            <div class="chat-message">
                <div class="chat-message-platform-icon-container">
                    <img src="/favicon.png" alt="favicon" style="width: 20px; height: 20px;">
                </div>
                <div class="chat-message-nickname-container">  
                    <div class="chat-message-nickname">꾸덕이</div>
                </div>
                <div class="chat-message-content-container">
                    <strong>1.0.25 업데이트사항</strong><br>
                    1. 채팅 창의 4분 30초 주기 재연결을 개선하고, 중복 연결 및 복구 메시지 중복 표시를 방지했습니다.<br>
                    2. 치지직 닉네임에 타이틀 색상과 공식 색상표·기본 색상 규칙을 적용했습니다.<br>
                    3. 숲 닉네임에 공식 다크 모드 색상표를 적용했습니다.<br>
                    4. 숲 기본 334개·구독 58개 이모티콘을 지원하며, 응원 이모티콘 등은 움직이는 이미지로 표시합니다.
                </div>
            </div>
            <div class="chat-message">
                <div class="chat-message-platform-icon-container">
                    <img src="/favicon.png" alt="favicon" style="width: 20px; height: 20px;">
                </div>
                <div class="chat-message-nickname-container">  
                    <div class="chat-message-nickname">YoBot</div>
                </div>
                <div class="chat-message-content-container">
                    오늘도 즐거운 방송!!
                </div>
            </div>
        </div>
        <div id="chat-controller">
            <div id="broad_time">00:00:00</div>
            <div class="memo-container">
                <textarea id="memo-input" placeholder="메모할 내용을 입력하세요..."></textarea>
                <button id="save-memo-btn">메모 저장</button>
                <div id="memo-status" class="memo-status"></div>
            </div>
        </div>
    </div>
    

    <script src="lib/phaser.js"></script>
    <script type="module" src="app.js"></script>
    
</body>

</html>
